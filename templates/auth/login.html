{% extends "base.html" %}{% block title %}User Sign In{% endblock %}{% block content %}<section class="auth-shell"><div class="auth-card"><div class="eyebrow">USER ACCESS</div><h1>Sign in to review your account.</h1><form method="post"><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><label class="check"><input type="checkbox" name="remember"> Remember me</label><button class="btn primary full">User sign in</button></form><a class="small-link" href="{{ url_for('forgot_password') }}">Forgot password?</a><p class="auth-foot">No account? <a href="{{ url_for('register') }}">Create one</a></p><p class="auth-foot">Administrator? <a href="{{ url_for('admin_login') }}">Use the admin sign-in</a></p></div></section>{% endblock %}

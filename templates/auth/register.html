{% extends "base.html" %}{% block title %}Create Account{% endblock %}{% block content %}<section class="auth-shell"><div class="auth-card"><div class="eyebrow">GET STARTED</div><h1>Create your workspace.</h1><form method="post"><label>Full name<input name="name" required maxlength="120"></label><label>Email<input type="email" name="email" required maxlength="180"></label><label>Password<input type="password" name="password" minlength="8" required></label><label>Confirm password<input type="password" name="confirm_password" minlength="8" required></label><button class="btn primary full">Create account</button></form><p class="auth-foot">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></section>{% endblock %}
